# Include inside the HTTPS server block. Re-include in any location that defines add_header.
# Motion/Radix use inline styles; scripts remain restricted to same-origin bundles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; frame-src 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HTTPS only. Start at one day; increase after verifying certificate renewal.
# Do not add includeSubDomains/preload until every subdomain is HTTPS-ready.
add_header Strict-Transport-Security "max-age=86400" always;
